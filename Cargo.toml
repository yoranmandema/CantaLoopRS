[package]
name = "CantaLoopRS"
version = "0.1.0"
edition = "2021"

[dependencies]
lazy_static = "1.5.0"
pest = "2.8.4"
pest_derive = "2.8.4"
tower-lsp = "0.20"
lsp-types = "0.94"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
bitflags = "2.5"

[dev-dependencies]
tempfile = "3.10"

[profile.dev]
opt-level = 1
debug = 1
incremental = true

[profile.dev.package."*"]
opt-level = 2

[[bin]]
name = "cantaloop-lsp"
path = "src/lsp/main.rs"

[[bin]]
name = "melon"
path = "src/melon/main.rs"